[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ai-dashboard-agent-backend"
version = "0.1.0"
description = "Local FastAPI backend for the AI Dashboard Agent MVP"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "fastapi==0.143.0",
  "langgraph==1.2.15",
  "openai==3.31.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "sqlglot==30.22.0",
  "SQLAlchemy==2.1.4",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.1",
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

